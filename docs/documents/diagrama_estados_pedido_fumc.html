
<div id="state-dia"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2438' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    secondaryColor: dark ? '#082e1e' : '#E1F5EE',
    tertiaryColor: dark ? '#1c1a10' : '#FAEEDA',
  },
});
const diagram = `stateDiagram-v2
  [*] --> Recibido : Vendedor crea pedido

  Recibido --> Confirmado : Stock disponible /\\ndescontar inventario
  Recibido --> PedidoEspecial : Stock insuficiente /\\ncrearpreventa
  Recibido --> Cancelado : Vendedor cancela

  PedidoEspecial --> Confirmado : Stock reabastecido /\\nnotificar vendedor
  PedidoEspecial --> Cancelado : Vendedor cancela

  Confirmado --> EnPreparacion : Operador inicia empaque
  Confirmado --> Cancelado : Admin cancela

  EnPreparacion --> Empacado : Operador confirma empaque
  Empacado --> Despachado : Transportadora asignada /\\nguía generada

  Despachado --> EnTransito : Transportadora confirma recogida
  EnTransito --> Entregado : Transportadora confirma entrega
  EnTransito --> Devuelto : Cliente rechaza / no hay nadie

  Devuelto --> EnPreparacion : Reintento de despacho
  Devuelto --> [*] : Devolución final registrada

  Entregado --> [*] : Liquidación calculada
  Cancelado --> [*]

  note right of Confirmado
    Se genera factura
    Se crea orden de despacho
  end note
  note right of Despachado
    Notificación automática
    al vendedor y cliente
  end note
`;
const { svg } = await mermaid.render('state-svg', diagram);
document.getElementById('state-dia').innerHTML = svg;
</script>
