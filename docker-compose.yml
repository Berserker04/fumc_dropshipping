services:
  mysql:
    image: mysql:8.4
    container_name: fumc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fumc
      MYSQL_USER: fumc
      MYSQL_PASSWORD: fumc
      MYSQL_ROOT_PASSWORD: fumc-root
    ports:
      - "3307:3306"
    volumes:
      - fumc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u fumc --password=fumc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fumc_mysql_data:
